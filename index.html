<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>Todo</h1>

    <form id="new-todo-form" autocomplete="off">
      <input id="new-todo" type="text" placeholder="What needs doing?" aria-label="New todo" maxlength="200">
      <button type="submit">Add</button>
    </form>

    <ul id="todo-list" aria-live="polite"></ul>
    <p id="empty" class="empty">Nothing here yet.</p>

    <footer id="footer">
      <span id="count">0 items left</span>
      <div class="filters" role="group" aria-label="Filter todos">
        <button type="button" data-filter="all" class="active">All</button>
        <button type="button" data-filter="active">Active</button>
        <button type="button" data-filter="completed">Completed</button>
      </div>
      <button type="button" id="clear-completed">Clear completed</button>
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
