<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#eef2ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121816" media="(prefers-color-scheme: dark)">
  <script>
    /* Apply the saved theme before CSS paints, to avoid a flash of the wrong theme.
       Keep in sync with the theme section of app.js. */
    (function () {
      var pref = "system";
      try {
        var saved = localStorage.getItem("simple-todo-app.theme");
        if (saved === "light" || saved === "dark") pref = saved;
      } catch (e) { /* storage unavailable: follow the system */ }
      var dark = pref === "dark" || (pref === "system" && !!window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
      var theme = dark ? "dark" : "light";
      var root = document.documentElement;
      root.setAttribute("data-theme", theme);
      root.style.colorScheme = theme;
      var metas = document.querySelectorAll('meta[name="theme-color"]');
      for (var i = 0; i < metas.length; i++) metas[i].setAttribute("content", dark ? "#121816" : "#eef2ee");
    })();
  </script>
  <title>Todo</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2322675a'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11.5' fill='none' stroke='%23fff' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="masthead">
      <div class="masthead-bar">
        <fieldset class="theme-switch">
          <legend class="visually-hidden">Theme</legend>
          <input type="radio" name="theme" id="theme-light" value="light">
          <label for="theme-light" title="Light theme">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
            <span class="visually-hidden">Light</span>
          </label>
          <input type="radio" name="theme" id="theme-dark" value="dark">
          <label for="theme-dark" title="Dark theme">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z"/></svg>
            <span class="visually-hidden">Dark</span>
          </label>
          <input type="radio" name="theme" id="theme-system" value="system" checked>
          <label for="theme-system" title="Match system theme">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8.5 20h7M12 16v4"/></svg>
            <span class="visually-hidden">System</span>
          </label>
        </fieldset>
      </div>
      <div class="masthead-text">
        <h1>Todo</h1>
        <p id="today" class="today"></p>
      </div>
      <div id="progress" class="progress" role="img" aria-label="No todos yet">
        <svg viewBox="0 0 44 44" aria-hidden="true" focusable="false">
          <circle class="progress-track" cx="22" cy="22" r="18"></circle>
          <circle id="progress-bar" class="progress-bar" cx="22" cy="22" r="18"></circle>
        </svg>
        <span id="progress-label" class="progress-label" aria-hidden="true">0/0</span>
      </div>
    </header>

    <section class="sheet" aria-label="Todo list">
      <form id="new-todo-form" class="composer" autocomplete="off">
        <label for="new-todo" class="visually-hidden">New todo</label>
        <svg class="composer-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 5v14M5 12h14"/></svg>
        <input id="new-todo" type="text" placeholder="What needs doing?" maxlength="200" enterkeyhint="done">
        <button type="submit" class="btn-primary">Add</button>
      </form>

      <ul id="todo-list" class="todo-list"></ul>

      <div id="empty" class="empty">
        <svg class="empty-art" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
          <rect x="12" y="8" width="40" height="48" rx="8"/>
          <path d="M22 24l3 3 6-6M22 38l3 3 6-6M36 25h8M36 39h8"/>
        </svg>
        <p id="empty-title" class="empty-title">Nothing to do yet</p>
        <p id="empty-hint" class="empty-hint">Add your first todo above and press Enter.</p>
      </div>

      <footer id="footer" class="toolbar">
        <span id="count" class="count">0 items left</span>
        <div class="filters" role="group" aria-label="Filter todos">
          <button type="button" data-filter="all" class="active" aria-pressed="true">All</button>
          <button type="button" data-filter="active" aria-pressed="false">Active</button>
          <button type="button" data-filter="completed" aria-pressed="false">Completed</button>
        </div>
        <button type="button" id="clear-completed" class="btn-quiet">Clear completed</button>
      </footer>
    </section>

    <p id="status" class="visually-hidden" role="status" aria-live="polite"></p>
  </main>
  <script src="app.js"></script>
</body>
</html>
